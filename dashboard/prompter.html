<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<!-- Added to an iPad's home screen it opens full screen, without Safari's bars -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Prompter">
<title>Prompter</title>
<script src="/shared/i18n.js"></script>
<script src="/shared/i18n-viewer.js"></script>
<script src="/dashboard/i18n-prompter.js"></script>
<script src="/shared/chat-bots.js"></script>
<link rel="stylesheet" href="/shared/themes.css">
<script src="/shared/theme.js"></script>
<!--
  The prompter: Leihu Singsing's lyrics, the song's progress and the chat, for a tablet behind the mic
  shield (open http://<this PC>:3000/prompter on it). Read only: the lyrics and position come from
  Leihu's live-lyrics state through the song queue (/api/prompter, Leihu itself answers this PC alone),
  the chat from the song queue's chat feed. Nothing here changes Leihu, the queue or the stream.
-->
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --ly: 1; --ch: 1; }   /* lyrics and chat text size, this device's own (− / + buttons) */

  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--text); font-family: var(--font-body);
    display: grid; grid-template-rows: auto 1fr auto 38%; grid-template-columns: 100%;
    height: 100vh; height: 100dvh; overflow: hidden;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    -webkit-text-size-adjust: 100%; -webkit-user-select: none; user-select: none;
  }
  body.no-chat { grid-template-rows: auto 1fr auto; }
  body.no-chat .chat { display: none; }
  /* Landscape: lyrics on the left, chat on the right */
  @media (orientation: landscape) and (min-width: 700px) {
    body { grid-template-columns: 1fr minmax(260px, 34%); grid-template-rows: auto 1fr auto; }
    .top, .lyrics, .progress { grid-column: 1; }
    .chat { grid-column: 2; grid-row: 1 / span 3; border-top: none !important; border-left: 1px solid var(--border); }
    body.no-chat { grid-template-columns: 1fr; }
  }

  /* ── top bar: song, key, settings ── */
  .top {
    display: flex; align-items: center; gap: 10px; padding: 10px 16px; min-width: 0;
    background: var(--bg-panel); border-bottom: 1px solid var(--border);
  }
  .song { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 17px; font-weight: 700; color: var(--text-strong, var(--text)); }
  .song .artist { font-weight: 400; color: var(--text-dim); }
  .key { flex-shrink: 0; font-size: 14px; font-weight: 700; padding: 2px 8px; border-radius: 6px; color: var(--accent); border: 1px solid var(--accent-dim); }
  .key:empty { display: none; }
  .tools { display: flex; gap: 6px; flex-shrink: 0; align-items: center; }
  .tool {
    font: inherit; font-size: 14px; min-width: 40px; height: 34px; padding: 0 8px; cursor: pointer;
    background: transparent; color: var(--text-dim); border: 1px solid var(--border); border-radius: 8px;
  }
  .tool:active { background: var(--bg-hover); }
  .lang-switch { display: flex; gap: 4px; }
  .lang-btn { font: inherit; font-size: 13px; height: 34px; padding: 0 8px; background: transparent; border: 1px solid var(--border); border-radius: 8px; color: var(--text-dim); cursor: pointer; }
  .lang-btn.active { color: var(--accent); border-color: var(--accent); }

  /* ── lyrics ── */
  .lyrics {
    position: relative; min-height: 0; overflow: hidden; padding: 12px 20px;
    display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 0.35em;
    font-size: calc(44px * var(--ly)); line-height: 1.35; text-align: center;
  }
  .ln { max-width: 100%; white-space: nowrap; color: var(--text-dim); font-size: 0.62em; }
  .ln.prev { opacity: 0.55; }
  .ln.now { position: relative; font-size: 1em; font-weight: 700; color: var(--text); }
  .ln.now .fill {
    position: absolute; left: 0; top: 0; white-space: nowrap; color: var(--accent);
    clip-path: inset(0 calc(100% - var(--p, 0%)) 0 0); -webkit-clip-path: inset(0 calc(100% - var(--p, 0%)) 0 0);
  }
  .ln.now.plain .fill { display: none; }
  .ln rt { font-size: 0.42em; font-weight: 400; color: var(--text-dim); }
  .note { font-size: calc(22px * var(--ly)); color: var(--text-dim); text-align: center; padding: 0 12px; }
  .lyrics .note { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  .note[hidden] { display: none !important; }

  /* ── progress (display only for now: Leihu can't be told where to jump yet) ── */
  .progress { display: flex; align-items: center; gap: 12px; padding: 8px 18px 12px; font-size: 15px; font-variant-numeric: tabular-nums; color: var(--text-dim); }
  .bar { flex: 1; height: 8px; border-radius: 4px; background: rgba(var(--accent-rgb), 0.18); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 4px; }
  .state { min-width: 0; color: var(--warn); font-weight: 700; }
  .state:empty { display: none; }

  /* ── chat ── */
  .chat { display: flex; flex-direction: column; min-height: 0; border-top: 1px solid var(--border); background: var(--bg-panel); }
  .chat-head { display: flex; align-items: center; gap: 8px; padding: 8px 14px; font-size: 13px; letter-spacing: 2px; color: var(--accent-dim); font-family: var(--font-display); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--good); }
  .dot.off { background: var(--danger); }
  .msgs {
    flex: 1; min-height: 0; overflow-y: auto; padding: 0 14px 10px; display: flex; flex-direction: column; gap: 6px;
    font-size: calc(19px * var(--ch)); line-height: 1.4; -webkit-user-select: text; user-select: text;
  }
  .msgs > :first-child { margin-top: auto; }   /* newest at the bottom, like Twitch */
  .msg { overflow-wrap: anywhere; }
  .msg .name { font-weight: 700; }
  .msg.event { color: var(--good); }
  .msg.redeem { color: var(--warn); }
  .msg .reply { display: block; font-size: 0.78em; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .badge { height: 1.05em; vertical-align: -0.16em; margin-right: 3px; }
  .emote { height: 1.6em; vertical-align: middle; margin: -0.3em 1px; }
  .mention { color: var(--accent); font-weight: 700; }
  .quote { display: block; color: var(--text); }
  .msgs .note { font-size: 15px; margin: auto; }
</style>
</head>
<body>
<div class="top">
  <div class="song" id="song"></div>
  <span class="key" id="key"></span>
  <div class="tools">
    <button class="tool" onclick="size('ly', -1)" data-i18n-aria-label="prompter.lyricsSmaller" data-i18n-title="prompter.lyricsSmaller">♪−</button>
    <button class="tool" onclick="size('ly', 1)" data-i18n-aria-label="prompter.lyricsBigger" data-i18n-title="prompter.lyricsBigger">♪+</button>
    <button class="tool" onclick="size('ch', -1)" data-i18n-aria-label="prompter.chatSmaller" data-i18n-title="prompter.chatSmaller">💬−</button>
    <button class="tool" onclick="size('ch', 1)" data-i18n-aria-label="prompter.chatBigger" data-i18n-title="prompter.chatBigger">💬+</button>
    <button class="tool" id="chat-toggle" onclick="toggleChat()">💬</button>
    <span class="lang-switch" role="group" aria-label="Language"></span>
  </div>
</div>

<div class="lyrics" id="lyrics">
  <div class="note" id="lyrics-note" hidden></div>
</div>

<div class="progress">
  <span id="pos">0:00</span>
  <div class="bar"><i id="bar"></i></div>
  <span id="dur">--:--</span>
  <span class="state" id="state"></span>
</div>

<div class="chat">
  <div class="chat-head"><span class="dot off" id="dot"></span><span data-i18n="prompter.chat">Chat</span></div>
  <div class="msgs" id="msgs" aria-live="polite"></div>
</div>

<script>
const t = I18N.t;
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const recall = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : v; } catch (_) { return d; } };
const remember = (k, v) => { try { localStorage.setItem(k, v); } catch (_) {} };

// ── this device's text sizes and chat on/off ──
const SIZES = { ly: Number(recall('prompter.ly', 1)) || 1, ch: Number(recall('prompter.ch', 1)) || 1 };
function applySizes() {
  for (const k of ['ly', 'ch']) document.documentElement.style.setProperty('--' + k, SIZES[k]);
  for (const r of rows) r.text = null;   // fit the lines again at the new size
}
function size(k, dir) {
  SIZES[k] = Math.min(2.5, Math.max(0.5, Math.round((SIZES[k] + dir * 0.1) * 10) / 10));
  remember('prompter.' + k, SIZES[k]);
  applySizes();
}
let chatOn = recall('prompter.chat', '1') === '1';
function paintChatToggle() {
  document.body.classList.toggle('no-chat', !chatOn);
  const b = document.getElementById('chat-toggle');
  b.title = b.ariaLabel = t(chatOn ? 'prompter.hideChat' : 'prompter.showChat');
  b.style.opacity = chatOn ? 1 : 0.5;
  for (const r of rows) r.text = null;
}
function toggleChat() { chatOn = !chatOn; remember('prompter.chat', chatOn ? '1' : '0'); paintChatToggle(); }

// ── lyrics: the line being sung, one before, three after ──
const OFFSETS = [-1, 0, 1, 2, 3];
const lyricsEl = document.getElementById('lyrics');
const rows = OFFSETS.map(off => {
  const el = document.createElement('div');
  el.className = 'ln' + (off === 0 ? ' now' : off < 0 ? ' prev' : '');
  if (off === 0) el.innerHTML = '<span class="base"></span><span class="fill" aria-hidden="true"></span>';
  lyricsEl.appendChild(el);
  return { off, el, text: null };
});

// Leihu's state; the position runs on this device's clock between reads, like Leihu's own overlay
const ST = { online: null, server: true, ver: null, lines: [], sid: null, title: '', artist: '', key: 0, color: true,
  duration: null, base: { t: 0, at: 0, playing: false, rate: 1 } };
function nowT() {
  const b = ST.base;
  return b.playing ? b.t + (performance.now() - b.at) / 1000 * b.rate : b.t;
}

async function poll() {
  try {
    const r = await fetch('/api/prompter' + (ST.ver != null ? '?ver=' + encodeURIComponent(ST.ver) : ''), { cache: 'no-store' });
    const d = await r.json();
    ST.server = true;
    ST.online = !!d.online;
    if (!d.online) { ST.sid = null; ST.ver = null; ST.lines = []; }
    else {
      if (d.lines) { ST.lines = d.lines; ST.ver = d.ver; for (const row of rows) row.text = null; }
      ST.sid = d.sid; ST.title = d.title; ST.artist = d.artist; ST.key = d.key; ST.color = d.color; ST.duration = d.duration;
      const pred = nowT(), b = ST.base;
      // While playing, correct the clock only when it drifts, so the colour fill doesn't jitter
      if (b.playing !== d.playing || b.rate !== d.rate || Math.abs(pred - d.t) > 0.15) {
        ST.base = { t: d.t, at: performance.now(), playing: d.playing, rate: d.rate };
      }
    }
  } catch (_) {
    ST.server = false;
  }
  paintInfo();
  setTimeout(poll, 250);
}

function paintInfo() {
  const song = document.getElementById('song');
  const open = ST.online && ST.sid;
  song.innerHTML = open ? `${esc(ST.title)}${ST.artist ? ` <span class="artist">— ${esc(ST.artist)}</span>` : ''}` : '';
  document.getElementById('key').textContent = open && ST.key ? t('prompter.key', { key: (ST.key > 0 ? '+' : '') + ST.key }) : '';
  document.title = open ? `${ST.title} — ${t('prompter.pageTitle')}` : t('prompter.pageTitle');
  const note = !ST.server ? t('prompter.noServer') : ST.online === false ? t('prompter.offline')
    : ST.online && !ST.sid ? t('prompter.idle') : open && !ST.lines.length ? t('prompter.noLyrics') : '';
  const el = document.getElementById('lyrics-note');
  el.textContent = note;
  el.hidden = !note;
}

function rubyHTML(r) { return r.map(([b, rt]) => (rt ? `<ruby>${esc(b)}<rt>${esc(rt)}</rt></ruby>` : esc(b))).join(''); }

// A line too long for the screen shrinks to fit instead of being cut
function fit(el) {
  el.style.fontSize = '';
  const max = lyricsEl.clientWidth - 40;
  if (el.scrollWidth > max && max > 0) {
    const cur = parseFloat(getComputedStyle(el).fontSize);
    el.style.fontSize = Math.max(12, cur * max / el.scrollWidth) + 'px';
  }
}

const clock = s => { s = Math.max(0, Math.floor(s)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };

function render() {
  const L = ST.online && ST.sid ? ST.lines : [];
  const tNow = nowT();
  let i = -1;
  for (let k = 0; k < L.length; k++) { if (L[k].t <= tNow + 0.05) i = k; else break; }
  for (const r of rows) {
    const l = L[i + r.off] || null;
    // Before the first line: the "now" row stays empty and the next row shows the first line
    const tx = l && !(r.off < 0 && i + r.off < 0) ? l.text : '';
    if (r.text !== tx) {
      r.text = tx;
      const h = l && l.r && tx ? rubyHTML(l.r) : null;
      if (r.off === 0) { for (const c of [r.el.querySelector('.base'), r.el.querySelector('.fill')]) h ? (c.innerHTML = h) : (c.textContent = tx); }
      else if (h) r.el.innerHTML = h;
      else r.el.textContent = tx;
      fit(r.el);
    }
    if (r.off === 0) {
      r.el.classList.toggle('plain', !ST.color);
      let p = 0;
      if (l && i >= 0) {
        p = Math.min(1, Math.max(0, (tNow - l.t) / Math.max(0.3, (l.end || l.t + 3) - l.t)));
        const c = l.c || [], n = c.length;
        if (n) {   // word timings: fill word by word
          let k = 0; while (k < n && c[k] <= tNow) k++;
          const nextT = k < n ? c[k] : Math.max(l.end || 0, (c[n - 1] || l.t) + 0.3);
          const prevT = k > 0 ? c[k - 1] : l.t;
          p = k === 0 ? 0 : Math.min(1, Math.max(0, (k - 1 + Math.min(1, Math.max(0, (tNow - prevT) / Math.max(0.05, nextT - prevT)))) / n));
        }
      }
      r.el.style.setProperty('--p', (p * 100).toFixed(1) + '%');
    }
  }
  // Progress: the song's length from Leihu's library (else the last lyric line's end)
  const open = ST.online && ST.sid;
  const last = L.length ? L[L.length - 1] : null;
  const dur = ST.duration || (last ? (last.end || last.t + 3) : 0);
  document.getElementById('pos').textContent = open ? clock(tNow) : '0:00';
  document.getElementById('dur').textContent = open && dur ? clock(dur) : '--:--';
  document.getElementById('bar').style.width = open && dur ? Math.min(100, tNow / dur * 100).toFixed(2) + '%' : '0';
  document.getElementById('state').textContent = open && !ST.base.playing ? t('prompter.paused') : '';
  requestAnimationFrame(render);
}

// ── chat: what the dashboard's chat shows, newest at the bottom ──
const EVENT_NOTICES = ['sub', 'resub', 'sub_gift', 'community_sub_gift', 'gift_paid_upgrade', 'prime_paid_upgrade',
  'pay_it_forward', 'raid', 'watch_streak', 'bits_badge_tier', 'charity_donation', 'announcement'];
const EVENT_ICONS = { raid: '🚀', sub_gift: '🎁', community_sub_gift: '🎁', charity_donation: '💗', bits_badge_tier: '💎', announcement: '📣', watch_streak: '🔥' };
const NAME_COLORS = ['#FF4A6A', '#5A9AFF', '#4AFF9A', '#B06AFF', '#FFB84A', '#FF7F50', '#9ACD32', '#FF69B4', '#1E90FF', '#00FF7F', '#DAA520', '#D2691E'];
const MAX = 80;
let records = [];
let badges = {};

function nameColor(user) {
  if (user.color) return Theme.nameColor(user.color);
  let h = 0;
  for (const c of user.login || user.name || '') h = (h * 31 + c.charCodeAt(0)) >>> 0;
  return Theme.nameColor(NAME_COLORS[h % NAME_COLORS.length]);
}

// Bots and !commands left out, so the chat that matters fits
function shows(rec) {
  if (rec.deleted) return false;
  const bot = (window.CHAT_BOTS || []).includes((rec.user.login || '').toLowerCase());
  if (rec.kind === 'chat') return !bot && !rec.text.startsWith('!');
  if (rec.kind === 'redeem' || rec.kind === 'follow') return true;
  if (rec.kind === 'notice') return EVENT_NOTICES.includes(rec.notice) && !(rec.notice === 'sub_gift' && rec.communityGift);
  return false;
}

function badgesHtml(user) {
  return (user.badgeIds || []).map(id => badges[id] ? `<img class="badge" src="${esc(badges[id])}" alt="" onerror="this.remove()">` : '').join('');
}

function partsHtml(rec) {
  const parts = rec.parts && rec.parts.length ? rec.parts : [{ t: 'text', text: rec.text }];
  return parts.map((p) => {
    if (p.t === 'emote') return `<img class="emote" src="https://static-cdn.jtvnw.net/emoticons/v2/${encodeURIComponent(p.id)}/default/dark/2.0" alt="${esc(p.text)}" onerror="this.replaceWith(this.alt)">`;
    if (p.t === 'mention') return `<span class="mention">${esc(p.text)}</span>`;
    if (p.t === 'cheer') return `<span class="mention">💎${esc(p.text)}</span>`;
    return esc(p.text);
  }).join('');
}

// A sub / gift / raid / follow in words, with the on-stream chat's strings (shared/i18n-viewer.js)
function eventLine(rec) {
  if (rec.kind === 'follow') return t('chatOverlay.followed', { name: rec.user.name });
  const key = 'chatOverlay.notice.' + rec.notice;
  const missing = { community_sub_gift: !rec.count, sub_gift: !rec.recipient, raid: rec.viewers == null,
    bits_badge_tier: !rec.bitsTier, charity_donation: !rec.charity }[rec.notice];
  if (!I18N.has(key) || missing) return rec.system || rec.notice;
  const tier = rec.tier && I18N.has('chatOverlay.tier.' + rec.tier) ? t('chatOverlay.tier.' + rec.tier) : '';
  const charity = rec.charity || {};
  return t(key, {
    name: rec.anonymous ? t('chatOverlay.anonymous') : rec.user.name, tier, months: rec.months, count: rec.count,
    recipient: rec.recipient && rec.recipient.name, viewers: rec.viewers, bitsTier: rec.bitsTier,
    charity: charity.name, amount: charity.amount != null ? `${charity.amount} ${charity.currency}`.trim() : '',
  });
}

function msgHtml(rec) {
  const name = `<span class="name" style="color:${esc(nameColor(rec.user))}">${esc(rec.user.name)}</span>`;
  const attrs = `data-id="${esc(rec.id)}" data-user="${esc(rec.user.id)}" data-kind="${esc(rec.kind)}"`;
  if (rec.kind === 'chat') {
    const reply = rec.reply ? `<span class="reply">↪ ${esc(rec.reply.name)}: ${esc(rec.reply.text)}</span>` : '';
    return `<div class="msg" ${attrs}>${reply}${badgesHtml(rec.user)}${name}: ${partsHtml(rec)}</div>`;
  }
  if (rec.kind === 'redeem') {
    return `<div class="msg redeem" ${attrs}>🎟 ${esc(t('chatOverlay.redeemed', { name: rec.user.name, reward: rec.reward }))}${rec.text ? `<span class="quote">${esc(rec.text)}</span>` : ''}</div>`;
  }
  if (rec.notice === 'announcement') return `<div class="msg event" ${attrs}>📣 ${badgesHtml(rec.user)}${name}: ${partsHtml(rec)}</div>`;
  const icon = rec.kind === 'follow' ? '💜' : (EVENT_ICONS[rec.notice] || '⭐');
  return `<div class="msg event" ${attrs}>${icon} ${esc(eventLine(rec))}${rec.text ? `<span class="quote">${partsHtml(rec)}</span>` : ''}</div>`;
}

const box = document.getElementById('msgs');
// Follow new messages only while already at the bottom (scrolling up to read stays put)
const atBottom = () => box.scrollHeight - box.scrollTop - box.clientHeight < 40;
function drawAll() {
  const shown = records.filter(shows).slice(-MAX);
  box.innerHTML = shown.length ? shown.map(msgHtml).join('') : `<div class="note">${esc(t('prompter.chatEmpty'))}</div>`;
  box.scrollTop = box.scrollHeight;
}
function add(rec) {
  records.push(rec);
  if (records.length > 300) records = records.slice(-300);
  if (!shows(rec)) return;
  const follow = atBottom();
  box.querySelector(':scope > .note')?.remove();
  box.insertAdjacentHTML('beforeend', msgHtml(rec));
  while (box.children.length > MAX) box.firstElementChild.remove();
  if (follow) box.scrollTop = box.scrollHeight;
}
// A mod deleted a message, timed out or banned a viewer, or cleared the chat
function remove(del) {
  for (const r of records) {
    if (r.kind === 'chat' && (del.all || (del.ids && del.ids.includes(r.id)) || (del.user && r.user.id === del.user))) r.deleted = true;
  }
  for (const el of [...box.querySelectorAll('.msg[data-kind="chat"]')]) {
    if (del.all || (del.ids && del.ids.includes(el.dataset.id)) || (del.user && el.dataset.user === del.user)) el.remove();
  }
}

async function loadRecent() {
  try { records = ((await (await fetch('/api/chat/recent')).json()).records || []).slice(-300); drawAll(); } catch (_) {}
}
async function loadBadges() {
  try { badges = await (await fetch('/api/chat/badges')).json(); drawAll(); } catch (_) {}
}

let ws, reconnectTimer;
function connect() {
  ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}`);
  ws.onopen = () => {
    document.getElementById('dot').classList.remove('off');
    clearTimeout(reconnectTimer);
    ws.send(JSON.stringify({ type: 'chat-subscribe' }));
    loadRecent();   // what came in while disconnected
    if (!Object.keys(badges).length) loadBadges();
  };
  ws.onclose = () => { document.getElementById('dot').classList.add('off'); reconnectTimer = setTimeout(connect, 3000); };
  ws.onmessage = (e) => {
    try {
      const m = JSON.parse(e.data);
      if (m.type === 'chat') add(m.record);
      if (m.type === 'chat-delete') remove(m);
      if (m.type === 'settings' && m.dashboardTheme) { Theme.apply(m.dashboardTheme); drawAll(); }
    } catch (_) {}
  };
}

// The dashboard's look; the text sizes stay this device's own
fetch('/api/settings').then(r => r.json()).then(s => { if (s.dashboardTheme) { Theme.apply(s.dashboardTheme); drawAll(); } }).catch(() => {});
I18N.init();
I18N.onChange(() => { paintInfo(); paintChatToggle(); drawAll(); });
addEventListener('resize', () => { for (const r of rows) r.text = null; });
applySizes();
paintChatToggle();
paintInfo();
drawAll();
poll();
connect();
requestAnimationFrame(render);
</script>
</body>
</html>
