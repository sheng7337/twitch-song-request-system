<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Clip Player</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: transparent;
    font-family: 'Segoe UI', sans-serif;
  }

  /* ── Full-screen media elements ── */
  #clip-video,
  #embed-frame {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    opacity: 0;
    transition: opacity 0.5s ease;
    border: none;
  }

  #clip-video { object-fit: cover; }

  /* ── Overlay (fades in/out with each clip) ── */
  #overlay {
    position: absolute;
    inset: 0;
    z-index: 2;
    opacity: 0;
    transition: opacity 0.5s ease;
    pointer-events: none;
  }

  #overlay.visible { opacity: 1; }

  /* bottom gradient for text legibility */
  #overlay::before {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 380px;
    background: linear-gradient(transparent, rgba(0,0,0,0.82));
  }

  /* top vignette */
  #overlay::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 120px;
    background: linear-gradient(rgba(0,0,0,0.35), transparent);
  }

  /* ── Neon border ── */
  #border {
    position: absolute;
    inset: 0;
    z-index: 3;
    box-shadow: inset 0 0 0 3px rgba(191,0,255,0.55),
                inset 0 0 40px rgba(191,0,255,0.08);
    pointer-events: none;
  }

  /* ── Scan line ── */
  @keyframes scan {
    0%   { transform: translateY(-2px); }
    100% { transform: translateY(1082px); }
  }

  #scan-line {
    position: absolute;
    left: 0; top: 0;
    width: 100%; height: 2px;
    background: linear-gradient(90deg, transparent 5%, rgba(191,0,255,0.45) 50%, transparent 95%);
    animation: scan 4s linear infinite;
    z-index: 4;
    pointer-events: none;
  }

  /* ── Text block ── */
  #text-block {
    position: absolute;
    bottom: 64px;
    left: 80px;
    right: 80px;
    z-index: 5;
  }

  #so-badge {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
  }

  .badge-line {
    width: 36px;
    height: 1px;
    background: #bf00ff;
    box-shadow: 0 0 6px #bf00ff;
  }

  .badge-label {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 5px;
    color: #bf00ff;
    text-shadow: 0 0 10px #bf00ff;
    text-transform: uppercase;
  }

  #credit-name {
    font-size: 80px;
    font-weight: 700;
    color: #fff;
    line-height: 1;
    text-shadow:
      0 0 20px rgba(191,0,255,0.9),
      0 0 60px rgba(191,0,255,0.4),
      2px 2px 0 rgba(0,0,0,0.6);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 10px;
  }

  #clip-title {
    font-size: 22px;
    color: rgba(255,255,255,0.65);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ── Progress bar ── */
  #progress-bar {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 4px;
    background: rgba(191,0,255,0.15);
    z-index: 6;
  }

  #progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #7b00ff, #bf00ff);
    box-shadow: 0 0 8px #bf00ff;
    width: 100%;
    transform-origin: left;
    transition: transform linear;
  }

  /* ── Sponsor roll (Japanese TV style) ── */
  #sponsor-roll {
    display: none;
    position: absolute;
    inset: 0;
    z-index: 20;
  }

  #sponsor-roll.active { display: block; }

  #sponsor-bg {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-color: #0d0d1a;
  }

  /* subtle dark scrim to keep white text readable over any background */
  #sponsor-bg::after {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.30);
  }

  /* Fixed-position layer — title and cards each have their own absolute top */
  #sponsor-content {
    position: absolute;
    inset: 0;
    z-index: 1;
  }

  /* 提供 pinned to a fixed Y; never moves when cards appear */
  #sponsor-title {
    position: absolute;
    top: 185px;
    left: 0;
    right: 0;
    text-align: center;
    font-family: 'Yu Mincho', 'YuMincho', 'MS Mincho', 'Hiragino Mincho ProN', serif;
    font-size: 120px;
    font-weight: 700;
    color: #ffffff;
    letter-spacing: 0.35em;
    text-shadow: 0 2px 24px rgba(0, 0, 0, 0.85);
    opacity: 0;
    transition: opacity 0.6s ease;
  }

  #sponsor-rule {
    position: absolute;
    top: 358px;
    left: 50%;
    transform: translateX(-50%);
    width: 600px;
    height: 1px;
    background: rgba(255, 255, 255, 0.55);
    opacity: 0;
    transition: opacity 0.6s ease;
  }

  #sponsor-cards {
    position: absolute;
    top: 405px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 28px;
    opacity: 0;
    transition: opacity 0.5s ease;
  }

  #sponsor-cards.visible { opacity: 1; }

  .sp-card {
    display: flex;
    align-items: center;
    gap: 28px;
  }

  .sp-avatar {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid rgba(255, 255, 255, 0.75);
    flex-shrink: 0;
  }

  .sp-avatar-fallback {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.18);
    border: 2px solid rgba(255, 255, 255, 0.75);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Yu Mincho', 'YuMincho', 'MS Mincho', serif;
    font-size: 32px;
    font-weight: 700;
    color: #ffffff;
    flex-shrink: 0;
    text-transform: uppercase;
  }

  .sp-text {
    display: flex;
    flex-direction: column;
    gap: 4px;
    max-width: 580px;
    min-width: 0;
  }

  .sp-name {
    font-family: 'Yu Mincho', 'YuMincho', 'MS Mincho', 'Hiragino Mincho ProN', serif;
    font-size: 52px;
    font-weight: 400;
    color: #ffffff;
    text-shadow: 0 2px 12px rgba(0, 0, 0, 0.8);
    letter-spacing: 0.04em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .sp-login {
    font-family: 'Segoe UI', sans-serif;
    font-size: 30px;
    font-weight: 400;
    color: rgba(255, 255, 255, 0.60);
    text-shadow: 0 1px 8px rgba(0, 0, 0, 0.8);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
</style>
</head>
<body>

<video id="clip-video" playsinline></video>
<iframe id="embed-frame" frameborder="0"
  allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
  allowfullscreen></iframe>

<div id="overlay">
  <div id="border"></div>
  <div id="scan-line"></div>

  <div id="text-block">
    <div id="so-badge">
      <div class="badge-line"></div>
      <span class="badge-label" id="badge-label">Shoutout</span>
      <div class="badge-line"></div>
    </div>
    <div id="credit-name"></div>
    <div id="clip-title"></div>
  </div>

  <div id="progress-bar">
    <div id="progress-fill"></div>
  </div>
</div>

<div id="sponsor-roll">
  <div id="sponsor-bg"></div>
  <div id="sponsor-content">
    <div id="sponsor-title">提供</div>
    <div id="sponsor-rule"></div>
    <div id="sponsor-cards"></div>
  </div>
</div>

<script>
  const overlay    = document.getElementById('overlay');
  const videoEl    = document.getElementById('clip-video');
  const iframeEl   = document.getElementById('embed-frame');
  const badgeEl    = document.getElementById('badge-label');
  const creditEl   = document.getElementById('credit-name');
  const titleEl    = document.getElementById('clip-title');
  const fillEl     = document.getElementById('progress-fill');

  const YOUTUBE_MAX_MS = 10 * 60 * 1000; // 10-min cap for YouTube (can't detect end)

  let dismissTimer = null;
  let clearTimer = null;
  let ws = null;

  function sendToServer(msg) {
    if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(msg));
  }

  function showMedia(msg) {
    if (dismissTimer) { clearTimeout(dismissTimer); dismissTimer = null; }
    if (clearTimer)   { clearTimeout(clearTimer);   clearTimer = null; }

    // Reset both media elements before loading new content
    videoEl.onended = null;
    videoEl.style.opacity = '0';
    iframeEl.style.opacity = '0';
    iframeEl.src = '';
    videoEl.src  = '';

    badgeEl.textContent  = msg.label  || 'Shoutout';
    creditEl.textContent = msg.credit || '';
    titleEl.textContent  = msg.title  || '';

    if (msg.kind === 'youtube') {
      // Small delay ensures src='' is processed before setting the new URL
      setTimeout(() => {
        iframeEl.src = msg.src;
        iframeEl.style.opacity = '1';
        // Send listening init so YouTube begins posting state events
        iframeEl.onload = () => {
          iframeEl.contentWindow?.postMessage('{"event":"listening"}', '*');
          iframeEl.onload = null;
        };
      }, 50);
      // Fallback timeout in case YouTube never fires an ended event (live, playlist, etc.)
      const timeout = YOUTUBE_MAX_MS;
      dismissTimer = setTimeout(() => hideMedia(true), timeout);
      startProgressBar(timeout);
    } else {
      videoEl.src = msg.src;
      videoEl.play().catch(() => {});
      videoEl.style.opacity = '1';
      videoEl.onended = () => hideMedia(true);
      const durationMs = (msg.duration || 30) * 1000;
      dismissTimer = setTimeout(() => hideMedia(true), durationMs + 3000);
      startProgressBar(durationMs);
    }

    overlay.classList.add('visible');
  }

  function startProgressBar(durationMs) {
    fillEl.style.transition = 'none';
    fillEl.style.transform  = 'scaleX(1)';
    void fillEl.offsetWidth;
    fillEl.style.transition = `transform ${durationMs}ms linear`;
    fillEl.style.transform  = 'scaleX(0)';
  }

  // notifyServer=true  → natural end / timeout, tell server to advance the queue
  // notifyServer=false → !stop command cleared the queue server-side already
  function hideMedia(notifyServer) {
    overlay.classList.remove('visible');
    videoEl.style.opacity = '0';
    iframeEl.style.opacity = '0';
    videoEl.onended = null;
    iframeEl.onload = null;
    if (dismissTimer) { clearTimeout(dismissTimer); dismissTimer = null; }
    clearTimer = setTimeout(() => { clearTimer = null; videoEl.src = ''; iframeEl.src = ''; }, 500);
    if (notifyServer) sendToServer({ type: 'media-ended' });
  }

  // YouTube IFrame API sends postMessage events when enablejsapi=1 is in the URL.
  // state 0 = ended; dismiss immediately so the next queue item can play.
  window.addEventListener('message', (e) => {
    try {
      const data = JSON.parse(e.data);
      if (data.event === 'onStateChange' && data.info === 0) {
        hideMedia(true);
      }
    } catch (_) {}
  });

  // ── Sponsor roll ─────────────────────────────────────────────────────────────

  const sponsorRollEl  = document.getElementById('sponsor-roll');
  const sponsorBgEl    = document.getElementById('sponsor-bg');
  const sponsorTitleEl = document.getElementById('sponsor-title');
  const sponsorRuleEl  = document.getElementById('sponsor-rule');
  const sponsorCardsEl = document.getElementById('sponsor-cards');

  const CARDS_PER_PAGE  = 4;
  const PAGE_HOLD_MS    = 5000;
  const LAST_PAGE_HOLD  = 10000;
  const PAGE_FADE_MS    = 500;

  let sponsorGen = 0; // generation counter; incrementing cancels all pending callbacks

  function showSponsorRoll(msg) {
    const broadcasters = msg.broadcasters || [];
    if (!broadcasters.length) { sendToServer({ type: 'media-ended' }); return; }

    const gen = ++sponsorGen;

    sponsorBgEl.style.backgroundImage = msg.bgUrl ? `url("${msg.bgUrl}")` : 'none';
    sponsorTitleEl.style.opacity = '0';
    sponsorRuleEl.style.opacity = '0';
    sponsorCardsEl.classList.remove('visible');
    sponsorCardsEl.innerHTML = '';
    sponsorRollEl.classList.add('active');

    // Fade in title + rule
    setTimeout(() => {
      if (sponsorGen !== gen) return;
      sponsorTitleEl.style.opacity = '1';
      sponsorRuleEl.style.opacity = '1';
    }, 300);

    // Start paging after title has faded in
    const pages = [];
    for (let i = 0; i < broadcasters.length; i += CARDS_PER_PAGE) {
      pages.push(broadcasters.slice(i, i + CARDS_PER_PAGE));
    }

    function showPage(idx) {
      if (sponsorGen !== gen) return;

      if (idx >= pages.length) {
        // All pages done — fade out title + rule, then hide
        sponsorTitleEl.style.opacity = '0';
        sponsorRuleEl.style.opacity = '0';
        setTimeout(() => {
          if (sponsorGen !== gen) return;
          sponsorRollEl.classList.remove('active');
          sendToServer({ type: 'media-ended' });
        }, 600);
        return;
      }

      sponsorCardsEl.innerHTML = '';
      pages[idx].forEach(b => sponsorCardsEl.appendChild(makeSponsorCard(b)));

      setTimeout(() => {
        if (sponsorGen !== gen) return;
        sponsorCardsEl.classList.add('visible');

        const holdMs = (idx === pages.length - 1) ? LAST_PAGE_HOLD : PAGE_HOLD_MS;
        setTimeout(() => {
          if (sponsorGen !== gen) return;
          sponsorCardsEl.classList.remove('visible');

          setTimeout(() => showPage(idx + 1), PAGE_FADE_MS);
        }, holdMs);
      }, 50);
    }

    setTimeout(() => showPage(0), 1000); // wait for title to appear first
  }

  function makeSponsorCard(broadcaster) {
    const card = document.createElement('div');
    card.className = 'sp-card';

    const initials = (broadcaster.displayName || broadcaster.login || '?').slice(0, 2);

    if (broadcaster.avatarUrl) {
      const img = document.createElement('img');
      img.className = 'sp-avatar';
      img.src = broadcaster.avatarUrl;
      img.onerror = () => img.replaceWith(makeAvatarFallback(initials));
      card.appendChild(img);
    } else {
      card.appendChild(makeAvatarFallback(initials));
    }

    const textBlock = document.createElement('div');
    textBlock.className = 'sp-text';

    const name = document.createElement('div');
    name.className = 'sp-name';
    name.textContent = broadcaster.displayName || broadcaster.login;
    textBlock.appendChild(name);

    const login = document.createElement('div');
    login.className = 'sp-login';
    login.textContent = '@' + broadcaster.login;
    textBlock.appendChild(login);

    card.appendChild(textBlock);

    return card;
  }

  function makeAvatarFallback(initials) {
    const div = document.createElement('div');
    div.className = 'sp-avatar-fallback';
    div.textContent = initials;
    return div;
  }

  function hideSponsorRoll() {
    sponsorGen++; // cancels any pending showPage callbacks
    sponsorCardsEl.classList.remove('visible');
    sponsorTitleEl.style.opacity = '0';
    sponsorRuleEl.style.opacity = '0';
    setTimeout(() => sponsorRollEl.classList.remove('active'), 600);
  }

  // ── WebSocket connection ──────────────────────────────────────────────────────

  function connect() {
    ws = new WebSocket(`ws://${window.location.host}`);
    ws.onmessage = (e) => {
      let msg;
      try { msg = JSON.parse(e.data); } catch (_) { return; }
      if (msg.type === 'media') {
        if (msg.kind === 'sponsor-card') showSponsorRoll(msg);
        else showMedia(msg);
      }
      if (msg.type === 'media-stop') { hideSponsorRoll(); hideMedia(false); }
    };
    ws.onclose = () => { ws = null; setTimeout(connect, 3000); };
    ws.onerror = () => ws.close();
  }

  connect();
</script>
</body>
</html>
