<!DOCTYPE html>
<html lang="en" data-surface="overlay" data-fonts="none">
<head>
<meta charset="UTF-8">
<title>Clip Player</title>
<script src="/shared/i18n.js"></script>
<script src="/shared/i18n-viewer.js"></script>
<!-- The sponsor roll's glow takes the overlay theme's accent; its fonts and white text stay (TV style) -->
<link rel="stylesheet" href="/shared/themes.css">
<script src="/shared/theme.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: transparent;
    font-family: 'Segoe UI', sans-serif;
  }

  /* ── Full-screen media elements ── */
  #clip-video,
  #clip-video-plain,
  #embed-frame {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    opacity: 0;
    transition: opacity 0.5s ease;
    border: none;
  }

  #clip-video, #clip-video-plain { object-fit: cover; }

  /* ── Overlay (fades in/out with each clip) ── */
  #overlay {
    position: absolute;
    inset: 0;
    z-index: 2;
    opacity: 0;
    transition: opacity 0.5s ease;
    pointer-events: none;
  }

  #overlay.visible { opacity: 1; }

  /* bottom gradient for text legibility */
  #overlay::before {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 380px;
    background: linear-gradient(transparent, rgba(0,0,0,0.82));
  }

  /* top vignette */
  #overlay::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 120px;
    background: linear-gradient(rgba(0,0,0,0.35), transparent);
  }

  /* ── Neon border ── */
  #border {
    position: absolute;
    inset: 0;
    z-index: 3;
    box-shadow: inset 0 0 0 3px rgba(var(--accent-rgb), 0.55),
                inset 0 0 40px rgba(var(--accent-rgb), 0.08);
    pointer-events: none;
  }

  /* ── Scan line ── */
  @keyframes scan {
    0%   { transform: translateY(-2px); }
    100% { transform: translateY(1082px); }
  }

  #scan-line {
    position: absolute;
    left: 0; top: 0;
    width: 100%; height: 2px;
    background: linear-gradient(90deg, transparent 5%, rgba(var(--accent-rgb), 0.45) 50%, transparent 95%);
    animation: scan 4s linear infinite;
    z-index: 4;
    pointer-events: none;
  }

  /* ── Text block ── */
  #text-block {
    position: absolute;
    bottom: 64px;
    left: 80px;
    right: 80px;
    z-index: 5;
  }

  #so-badge {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
  }

  .badge-line {
    width: 36px;
    height: 1px;
    background: var(--accent);
    box-shadow: 0 0 6px var(--accent);
  }

  .badge-label {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 5px;
    color: var(--accent);
    text-shadow: 0 0 10px var(--accent);
    text-transform: uppercase;
  }

  #credit-name {
    font-size: 80px;
    font-weight: 700;
    color: #fff;
    line-height: 1;
    text-shadow:
      0 0 20px rgba(var(--accent-rgb), 0.9),
      0 0 60px rgba(var(--accent-rgb), 0.4),
      2px 2px 0 rgba(0,0,0,0.6);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 10px;
  }

  #clip-title {
    font-size: 22px;
    color: rgba(255,255,255,0.65);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ── Progress bar ── */
  #progress-bar {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 4px;
    background: rgba(var(--accent-rgb), 0.15);
    z-index: 6;
  }

  #progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent-dim), var(--accent));
    box-shadow: 0 0 8px var(--accent);
    width: 100%;
    transform-origin: left;
    transition: transform linear;
  }

  /* ── Sponsor roll (Japanese TV style) ── */
  #sponsor-roll {
    display: none;
    position: absolute;
    inset: 0;
    z-index: 20;
  }

  #sponsor-roll.active { display: block; }

  #sponsor-bg {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-color: #0d0d1a;   /* any theme: behind the roll's picture */
  }

  /* subtle dark scrim to keep white text readable over any background */
  #sponsor-bg::after {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.30);
  }

  /* Fixed-position layer — title and cards each have their own absolute top */
  #sponsor-content {
    position: absolute;
    inset: 0;
    z-index: 1;
  }

  /* 提供 pinned to a fixed Y; never moves when cards appear */
  #sponsor-title {
    position: absolute;
    top: 185px;
    left: 0;
    right: 0;
    text-align: center;
    font-family: 'Yu Mincho', 'YuMincho', 'MS Mincho', 'Hiragino Mincho ProN', serif;
    font-size: 120px;
    font-weight: 700;
    color: #ffffff;
    letter-spacing: 0.35em;
    text-shadow: 0 2px 24px rgba(0, 0, 0, 0.85);
    opacity: 0;
    transition: opacity 0.6s ease;
  }

  /* !endingtk group headings (感謝訂閱 …): smaller, closer to the rule */
  #sponsor-title.heading {
    top: 225px;
    font-size: 84px;
    letter-spacing: 0.12em;
  }

  #sponsor-rule {
    position: absolute;
    top: 358px;
    left: 50%;
    transform: translateX(-50%);
    width: 600px;
    height: 1px;
    background: rgba(255, 255, 255, 0.55);
    opacity: 0;
    transition: opacity 0.6s ease;
  }

  #sponsor-cards {
    position: absolute;
    top: 405px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 28px;
    opacity: 0;
    transition: opacity 0.5s ease;
  }

  #sponsor-cards.visible { opacity: 1; }

  .sp-card {
    display: flex;
    align-items: center;
    gap: 28px;
  }

  .sp-avatar {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid rgba(255, 255, 255, 0.75);
    flex-shrink: 0;
  }

  .sp-avatar-fallback {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.18);
    border: 2px solid rgba(255, 255, 255, 0.75);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Yu Mincho', 'YuMincho', 'MS Mincho', serif;
    font-size: 32px;
    font-weight: 700;
    color: #ffffff;
    flex-shrink: 0;
    text-transform: uppercase;
  }

  .sp-text {
    display: flex;
    flex-direction: column;
    gap: 4px;
    max-width: 580px;
    min-width: 0;
  }

  .sp-name {
    font-family: 'Yu Mincho', 'YuMincho', 'MS Mincho', 'Hiragino Mincho ProN', serif;
    font-size: 52px;
    font-weight: 400;
    color: #ffffff;
    text-shadow: 0 2px 12px rgba(0, 0, 0, 0.8);
    letter-spacing: 0.04em;
    white-space: nowrap;
    display: flex;
    align-items: baseline;
    gap: 0.3em;
  }
  .sp-name-text { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .sp-gift { flex: none; font-family: 'Segoe UI', sans-serif; font-size: 0.7em; color: #ffd27a; }   /* any theme: gold on the roll's own picture, like its white names */

  .sp-login {
    font-family: 'Segoe UI', sans-serif;
    font-size: 30px;
    font-weight: 400;
    color: rgba(255, 255, 255, 0.60);
    text-shadow: 0 1px 8px rgba(0, 0, 0, 0.8);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
</style>
</head>
<body>

<video id="clip-video" playsinline></video>
<!-- a video file from another site (!watch <link>): the browser won't let its sound through the level chain -->
<video id="clip-video-plain" playsinline></video>
<iframe id="embed-frame" frameborder="0"
  allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
  allowfullscreen></iframe>

<div id="overlay">
  <div id="border"></div>
  <div id="scan-line"></div>

  <div id="text-block">
    <div id="so-badge">
      <div class="badge-line"></div>
      <span class="badge-label" id="badge-label">Shoutout</span>
      <div class="badge-line"></div>
    </div>
    <div id="credit-name"></div>
    <div id="clip-title"></div>
  </div>

  <div id="progress-bar">
    <div id="progress-fill"></div>
  </div>
</div>

<audio id="sponsor-voice" preload="auto">
  <source src="sponsor-voice.wav" type="audio/wav">
  <source src="sponsor-voice.mp3" type="audio/mpeg">
</audio>

<div id="sponsor-roll">
  <div id="sponsor-bg"></div>
  <div id="sponsor-content">
    <div id="sponsor-title">提供</div>
    <div id="sponsor-rule"></div>
    <div id="sponsor-cards"></div>
  </div>
</div>

<script>
  const overlay    = document.getElementById('overlay');
  const mainVideo  = document.getElementById('clip-video');         // clips from the app: through the level chain
  const plainVideo = document.getElementById('clip-video-plain');   // files from other sites: as they are
  let videoEl = mainVideo;
  const iframeEl   = document.getElementById('embed-frame');
  const badgeEl    = document.getElementById('badge-label');
  const creditEl   = document.getElementById('credit-name');
  const titleEl    = document.getElementById('clip-title');
  const fillEl     = document.getElementById('progress-fill');

  const YOUTUBE_MAX_MS = 10 * 60 * 1000; // 10-min cap for YouTube (can't detect end)

  let dismissTimer = null;
  let clearTimer = null;
  let ws = null;
  let currentMediaId = null; // echoed back so the server can ignore stale end signals
  let loadToken = 0;         // a clip still loading when the next one (or !stop) comes is dropped
  let blobUrl = null;

  // ── Clip volume (server/clip-level.js) ──────────────────────────────────────
  // The app measures each clip (ffmpeg) and says how far to turn it up or down; here that gain, then a
  // compressor that turns down loud moments (a scream) and a limiter that keeps peaks below -1 dBFS.
  // Web Audio's compressor adds its own make-up gain ((1 / gain at 0 dB)^0.6); the gain after each takes
  // it back off, so speech stays where the measurement put it. Until the page may play sound (an
  // ordinary browser tab before a click) the clip plays as it is; in OBS it always may.
  const LEVEL = {
    squash: { threshold: -10, knee: 0, ratio: 6, attack: 0.003, release: 0.3 },   // speech peaks barely; a scream ~10+ dB
    limit:  { threshold: -1, knee: 0, ratio: 20, attack: 0.001, release: 0.1 },
  };
  const makeUpDb = (c) => -0.6 * (c.threshold - c.threshold / c.ratio);   // hard knee: gain at 0 dB in
  const dbToGain = (db) => Math.pow(10, db / 20);
  let audioCtx = null, chain = null;
  try { audioCtx = new AudioContext(); } catch (_) {}
  function levelChain() {
    if (chain) return chain;
    if (!audioCtx) return null;
    if (audioCtx.state !== 'running') { audioCtx.resume().catch(() => {}); return null; }
    try {
      const node = (opts) => {
        const c = audioCtx.createDynamicsCompressor();
        for (const k of Object.keys(opts)) c[k].value = opts[k];
        return c;
      };
      const gain = audioCtx.createGain();
      const squash = node(LEVEL.squash), back1 = audioCtx.createGain();
      const limit = node(LEVEL.limit), back2 = audioCtx.createGain();
      audioCtx.createMediaElementSource(mainVideo)
        .connect(gain).connect(squash).connect(back1).connect(limit).connect(back2).connect(audioCtx.destination);
      chain = { gain, squash, back1, limit, back2 };
    } catch (_) { return null; }
    return chain;
  }
  // level: 'on' / 'unmeasured' (no gain, still the compressor and limiter) / 'off' (as it is)
  function applyLevel(level, gainDb) {
    const c = levelChain();
    if (!c) return;
    const on = level !== 'off';
    c.gain.gain.value = on ? dbToGain(Math.max(-20, Math.min(12, Number(gainDb) || 0))) : 1;
    for (const [n, back, opts] of [[c.squash, c.back1, LEVEL.squash], [c.limit, c.back2, LEVEL.limit]]) {
      n.threshold.value = on ? opts.threshold : 0;
      n.ratio.value = on ? opts.ratio : 1;
      back.gain.value = on ? dbToGain(-makeUpDb(opts)) : 1;
    }
  }
  window.__clipLevel = { LEVEL, makeUpDb };   // for checking the chain offline

  function sendToServer(msg) {
    if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(msg));
  }

  function notifyEnded() {
    sendToServer({ type: 'media-ended', mediaId: currentMediaId });
  }

  function showMedia(msg) {
    if (dismissTimer) { clearTimeout(dismissTimer); dismissTimer = null; }
    if (clearTimer)   { clearTimeout(clearTimer);   clearTimer = null; }

    // Reset the media elements before loading new content
    const token = ++loadToken;
    for (const v of [mainVideo, plainVideo]) { v.onended = null; v.style.opacity = '0'; v.src = ''; }
    if (blobUrl) { URL.revokeObjectURL(blobUrl); blobUrl = null; }
    iframeEl.style.opacity = '0';
    iframeEl.src = '';

    // labelKey in the overlay language; older servers only send the English label
    badgeEl.textContent  = msg.labelKey && I18N.has('clip.' + msg.labelKey) ? I18N.t('clip.' + msg.labelKey) : (msg.label || I18N.t('clip.shoutout'));
    creditEl.textContent = msg.credit || '';
    titleEl.textContent  = msg.title  || '';

    if (msg.kind === 'youtube') {
      // Small delay ensures src='' is processed before setting the new URL
      setTimeout(() => {
        iframeEl.src = msg.src;
        iframeEl.style.opacity = '1';
        // Send listening init so YouTube begins posting state events
        iframeEl.onload = () => {
          iframeEl.contentWindow?.postMessage('{"event":"listening"}', '*');
          iframeEl.onload = null;
        };
      }, 50);
      // Fallback timeout in case YouTube never fires an ended event (live, playlist, etc.)
      const timeout = YOUTUBE_MAX_MS;
      dismissTimer = setTimeout(() => hideMedia(true), timeout);
      startProgressBar(timeout);
    } else {
      const durationMs = (msg.duration || 30) * 1000;
      const play = (src) => {
        videoEl.src = src;
        videoEl.play().catch(() => {});
        videoEl.style.opacity = '1';
        videoEl.onended = () => hideMedia(true);
        if (dismissTimer) clearTimeout(dismissTimer);
        dismissTimer = setTimeout(() => hideMedia(true), durationMs + 3000);
        startProgressBar(durationMs);
      };
      // Until it plays: as long as the clip would take, in case loading never ends
      dismissTimer = setTimeout(() => hideMedia(true), durationMs + 3000);
      const fromApp = new URL(msg.src, location.href).origin === location.origin;
      videoEl = fromApp ? mainVideo : plainVideo;
      if (!fromApp) { play(msg.src); }
      else {
        // The response says how loud the clip is; the clip plays from memory, already downloaded
        fetch(msg.src).then(async (r) => {
          if (!r.ok) throw new Error(String(r.status));
          const level = r.headers.get('X-Clip-Level') || 'unmeasured';
          const gainDb = r.headers.get('X-Clip-Gain-Db');
          const blob = await r.blob();
          if (token !== loadToken) return;
          applyLevel(level, gainDb);
          blobUrl = URL.createObjectURL(blob);
          play(blobUrl);
        }).catch(() => {
          if (token !== loadToken) return;
          applyLevel('unmeasured', 0);
          play(msg.src);
        });
      }
    }

    overlay.classList.add('visible');
  }

  function startProgressBar(durationMs) {
    fillEl.style.transition = 'none';
    fillEl.style.transform  = 'scaleX(1)';
    void fillEl.offsetWidth;
    fillEl.style.transition = `transform ${durationMs}ms linear`;
    fillEl.style.transform  = 'scaleX(0)';
  }

  // notifyServer=true  → natural end / timeout, tell server to advance the queue
  // notifyServer=false → !stop command cleared the queue server-side already
  function hideMedia(notifyServer) {
    loadToken++;   // a clip still loading doesn't start after this
    overlay.classList.remove('visible');
    for (const v of [mainVideo, plainVideo]) { v.style.opacity = '0'; v.onended = null; }
    iframeEl.style.opacity = '0';
    iframeEl.onload = null;
    if (dismissTimer) { clearTimeout(dismissTimer); dismissTimer = null; }
    clearTimer = setTimeout(() => {
      clearTimer = null;
      for (const v of [mainVideo, plainVideo]) v.src = '';
      iframeEl.src = '';
      if (blobUrl) { URL.revokeObjectURL(blobUrl); blobUrl = null; }
    }, 500);
    if (notifyServer) notifyEnded();
  }

  // YouTube IFrame API sends postMessage events when enablejsapi=1 is in the URL.
  // state 0 = ended; dismiss immediately so the next queue item can play.
  window.addEventListener('message', (e) => {
    try {
      const data = JSON.parse(e.data);
      if (data.event === 'onStateChange' && data.info === 0) {
        hideMedia(true);
      }
    } catch (_) {}
  });

  // ── Sponsor roll ─────────────────────────────────────────────────────────────

  const sponsorRollEl  = document.getElementById('sponsor-roll');
  const sponsorBgEl    = document.getElementById('sponsor-bg');
  const sponsorTitleEl = document.getElementById('sponsor-title');
  const sponsorRuleEl  = document.getElementById('sponsor-rule');
  const sponsorCardsEl = document.getElementById('sponsor-cards');
  const sponsorVoiceEl = document.getElementById('sponsor-voice');

  const CARDS_PER_PAGE  = 4;
  const PAGE_HOLD_MS    = 5000;
  const LAST_PAGE_HOLD  = 10000;
  const PAGE_FADE_MS    = 500;

  let sponsorGen = 0; // generation counter; incrementing cancels all pending callbacks

  // !tk sends one list under 提供; !endingtk sends groups, each under its own heading (clip.credits.<key>)
  function setSponsorHeading(key) {
    sponsorTitleEl.textContent = key ? I18N.t('clip.credits.' + key) : '提供';
    sponsorTitleEl.classList.toggle('heading', !!key);
  }

  function showSponsorRoll(msg) {
    const groups = msg.groups || [{ key: null, people: msg.broadcasters || [] }];
    const pages = [];
    for (const g of groups) {
      for (let i = 0; i < g.people.length; i += CARDS_PER_PAGE) pages.push({ key: g.key, people: g.people.slice(i, i + CARDS_PER_PAGE) });
    }
    if (!pages.length) { notifyEnded(); return; }

    const gen = ++sponsorGen;
    setSponsorHeading(pages[0].key);

    sponsorBgEl.style.backgroundImage = msg.bgUrl ? `url("${msg.bgUrl}")` : 'none';
    sponsorTitleEl.style.opacity = '0';
    sponsorRuleEl.style.opacity = '0';
    sponsorCardsEl.classList.remove('visible');
    sponsorCardsEl.innerHTML = '';
    sponsorRollEl.classList.add('active');

    // Announce in Japanese
    if (sponsorVoiceEl) {
      sponsorVoiceEl.currentTime = 0;
      sponsorVoiceEl.play().catch(() => {});
    }

    // Fade in title + rule
    setTimeout(() => {
      if (sponsorGen !== gen) return;
      sponsorTitleEl.style.opacity = '1';
      sponsorRuleEl.style.opacity = '1';
    }, 300);

    // Start paging after title has faded in. A new group fades its heading in first.
    function showPage(idx) {
      if (sponsorGen !== gen) return;
      if (idx > 0 && idx < pages.length && pages[idx].key !== pages[idx - 1].key) {
        sponsorTitleEl.style.opacity = '0';
        setTimeout(() => {
          if (sponsorGen !== gen) return;
          setSponsorHeading(pages[idx].key);
          sponsorTitleEl.style.opacity = '1';
          setTimeout(() => fillPage(idx), 600);
        }, 600);
        return;
      }
      fillPage(idx);
    }

    function fillPage(idx) {
      if (sponsorGen !== gen) return;

      if (idx >= pages.length) {
        // All pages done — fade out title + rule, then hide
        sponsorTitleEl.style.opacity = '0';
        sponsorRuleEl.style.opacity = '0';
        setTimeout(() => {
          if (sponsorGen !== gen) return;
          sponsorRollEl.classList.remove('active');
          notifyEnded();
        }, 600);
        return;
      }

      sponsorCardsEl.innerHTML = '';
      pages[idx].people.forEach(b => sponsorCardsEl.appendChild(makeSponsorCard(b)));

      setTimeout(() => {
        if (sponsorGen !== gen) return;
        sponsorCardsEl.classList.add('visible');

        const holdMs = (idx === pages.length - 1) ? LAST_PAGE_HOLD : PAGE_HOLD_MS;
        setTimeout(() => {
          if (sponsorGen !== gen) return;
          sponsorCardsEl.classList.remove('visible');

          setTimeout(() => showPage(idx + 1), PAGE_FADE_MS);
        }, holdMs);
      }, 50);
    }

    setTimeout(() => showPage(0), 1000); // wait for title to appear first
  }

  function makeSponsorCard(broadcaster) {
    const card = document.createElement('div');
    card.className = 'sp-card';

    const initials = (broadcaster.displayName || broadcaster.login || '?').slice(0, 2);

    if (broadcaster.avatarUrl) {
      const img = document.createElement('img');
      img.className = 'sp-avatar';
      img.src = broadcaster.avatarUrl;
      img.onerror = () => img.replaceWith(makeAvatarFallback(initials));
      card.appendChild(img);
    } else {
      card.appendChild(makeAvatarFallback(initials));
    }

    const textBlock = document.createElement('div');
    textBlock.className = 'sp-text';

    const name = document.createElement('div');
    name.className = 'sp-name';
    const nameText = document.createElement('span');
    nameText.className = 'sp-name-text';
    nameText.textContent = broadcaster.displayName || broadcaster.login;
    name.appendChild(nameText);
    if (broadcaster.gifts > 0) {   // !endingtk: subs this viewer gifted
      const gift = document.createElement('span');
      gift.className = 'sp-gift';
      gift.textContent = '🎁×' + broadcaster.gifts;
      name.appendChild(gift);
    }
    textBlock.appendChild(name);

    const login = document.createElement('div');
    login.className = 'sp-login';
    login.textContent = '@' + broadcaster.login;
    textBlock.appendChild(login);

    card.appendChild(textBlock);

    return card;
  }

  function makeAvatarFallback(initials) {
    const div = document.createElement('div');
    div.className = 'sp-avatar-fallback';
    div.textContent = initials;
    return div;
  }

  function hideSponsorRoll() {
    const gen = ++sponsorGen; // cancels any pending showPage callbacks
    if (sponsorVoiceEl) { sponsorVoiceEl.pause(); sponsorVoiceEl.currentTime = 0; }
    sponsorCardsEl.classList.remove('visible');
    sponsorTitleEl.style.opacity = '0';
    sponsorRuleEl.style.opacity = '0';
    setTimeout(() => { if (sponsorGen === gen) sponsorRollEl.classList.remove('active'); }, 600);   // not a roll that started since
  }

  // ── WebSocket connection ──────────────────────────────────────────────────────

  function connect() {
    ws = new WebSocket(`ws://${window.location.host}`);
    ws.onmessage = (e) => {
      let msg;
      try { msg = JSON.parse(e.data); } catch (_) { return; }
      if (msg.type === 'media') {
        currentMediaId = msg.mediaId ?? null;
        if (msg.kind === 'sponsor-card') showSponsorRoll(msg);
        else showMedia(msg);
      }
      if (msg.type === 'media-stop') { hideSponsorRoll(); hideMedia(false); }
      if (msg.type === 'preload-avatar' && msg.url) { new Image().src = msg.url; }
      if (msg.type === 'settings' && msg.overlayLanguage) I18N.setLang(msg.overlayLanguage, { save: false, tagPage: false });
      if (msg.type === 'settings' && msg.overlayTheme) Theme.apply(msg.overlayTheme);
    };
    ws.onclose = () => { ws = null; setTimeout(connect, 3000); };
    ws.onerror = () => ws.close();
  }

  // Labels follow the dashboard's overlay-language setting (English until it arrives)
  I18N.setLang('en', { save: false, tagPage: false });
  fetch('/api/settings').then(r => r.json()).then(s => {
    if (s.overlayLanguage) I18N.setLang(s.overlayLanguage, { save: false, tagPage: false });
    if (s.overlayTheme) Theme.apply(s.overlayTheme);
  }).catch(() => {});

  connect();
</script>
</body>
</html>
