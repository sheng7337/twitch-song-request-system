<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Clip Player</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: transparent;
    font-family: 'Segoe UI', sans-serif;
  }

  /* ── Full-screen video ── */
  #clip-video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 1;
    opacity: 0;
    transition: opacity 0.5s ease;
  }

  #clip-video.visible { opacity: 1; }

  /* ── Overlay (fades in/out with the clip) ── */
  #overlay {
    position: absolute;
    inset: 0;
    z-index: 2;
    opacity: 0;
    transition: opacity 0.5s ease;
    pointer-events: none;
  }

  #overlay.visible { opacity: 1; }

  /* bottom gradient for text legibility */
  #overlay::before {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 380px;
    background: linear-gradient(transparent, rgba(0,0,0,0.82));
  }

  /* top vignette */
  #overlay::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 120px;
    background: linear-gradient(rgba(0,0,0,0.35), transparent);
  }

  /* ── Neon border ── */
  #border {
    position: absolute;
    inset: 0;
    z-index: 3;
    box-shadow: inset 0 0 0 3px rgba(191,0,255,0.55),
                inset 0 0 40px rgba(191,0,255,0.08);
    pointer-events: none;
  }

  /* ── Scan line ── */
  @keyframes scan {
    0%   { transform: translateY(-2px); }
    100% { transform: translateY(1082px); }
  }

  #scan-line {
    position: absolute;
    left: 0; top: 0;
    width: 100%; height: 2px;
    background: linear-gradient(90deg, transparent 5%, rgba(191,0,255,0.45) 50%, transparent 95%);
    animation: scan 4s linear infinite;
    z-index: 4;
    pointer-events: none;
  }

  /* ── Text block ── */
  #text-block {
    position: absolute;
    bottom: 64px;
    left: 80px;
    right: 80px;
    z-index: 5;
  }

  #so-badge {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
  }

  .badge-line {
    width: 36px;
    height: 1px;
    background: #bf00ff;
    box-shadow: 0 0 6px #bf00ff;
  }

  .badge-label {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 5px;
    color: #bf00ff;
    text-shadow: 0 0 10px #bf00ff;
    text-transform: uppercase;
  }

  #broadcaster-name {
    font-size: 80px;
    font-weight: 700;
    color: #fff;
    line-height: 1;
    text-shadow:
      0 0 20px rgba(191,0,255,0.9),
      0 0 60px rgba(191,0,255,0.4),
      2px 2px 0 rgba(0,0,0,0.6);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 10px;
  }

  #clip-title {
    font-size: 22px;
    color: rgba(255,255,255,0.65);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ── Progress bar ── */
  #progress-bar {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 4px;
    background: rgba(191,0,255,0.15);
    z-index: 6;
  }

  #progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #7b00ff, #bf00ff);
    box-shadow: 0 0 8px #bf00ff;
    width: 100%;
    transform-origin: left;
    transition: transform linear;
  }
</style>
</head>
<body>

<video id="clip-video" playsinline></video>

<div id="overlay">
  <div id="border"></div>
  <div id="scan-line"></div>

  <div id="text-block">
    <div id="so-badge">
      <div class="badge-line"></div>
      <span class="badge-label">Shoutout</span>
      <div class="badge-line"></div>
    </div>
    <div id="broadcaster-name"></div>
    <div id="clip-title"></div>
  </div>

  <div id="progress-bar">
    <div id="progress-fill"></div>
  </div>
</div>

<script>
  const overlay      = document.getElementById('overlay');
  const videoEl      = document.getElementById('clip-video');
  const nameEl       = document.getElementById('broadcaster-name');
  const titleEl      = document.getElementById('clip-title');
  const fillEl       = document.getElementById('progress-fill');

  let dismissTimer = null;

  function showClip(clip) {
    if (dismissTimer) { clearTimeout(dismissTimer); dismissTimer = null; }

    nameEl.textContent  = '@' + clip.broadcasterName;
    titleEl.textContent = clip.title;

    videoEl.src = clip.videoUrl;
    videoEl.play().catch(() => {});

    const durationMs = (clip.duration || 30) * 1000;
    fillEl.style.transition = 'none';
    fillEl.style.transform  = 'scaleX(1)';
    void fillEl.offsetWidth;
    fillEl.style.transition = `transform ${durationMs}ms linear`;
    fillEl.style.transform  = 'scaleX(0)';

    overlay.classList.add('visible');
    videoEl.classList.add('visible');

    videoEl.onended = hideClip;
    dismissTimer = setTimeout(hideClip, Math.min(durationMs + 3000, 90000));
  }

  function hideClip() {
    overlay.classList.remove('visible');
    videoEl.classList.remove('visible');
    videoEl.onended = null;
    setTimeout(() => { videoEl.src = ''; }, 500);
    if (dismissTimer) { clearTimeout(dismissTimer); dismissTimer = null; }
  }

  function connect() {
    const ws = new WebSocket(`ws://${window.location.host}`);
    ws.onmessage = (e) => {
      let msg;
      try { msg = JSON.parse(e.data); } catch (_) { return; }
      if (msg.type === 'clip') showClip(msg.clip);
    };
    ws.onclose = () => setTimeout(connect, 3000);
    ws.onerror = () => ws.close();
  }

  connect();
</script>
</body>
</html>
