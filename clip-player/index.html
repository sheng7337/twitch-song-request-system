<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Clip Player</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: transparent;
    font-family: 'Segoe UI', sans-serif;
  }

  /* ── One-time audio unlock gate ── */
  #audio-gate {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.55);
    z-index: 100;
    cursor: pointer;
  }

  #audio-gate.hidden { display: none; }

  #audio-gate-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    border: 1px solid #bf00ff;
    background: rgba(13,0,26,0.9);
    padding: 28px 48px;
    color: #fff;
    font-family: inherit;
    cursor: pointer;
  }

  #audio-gate-btn .icon { font-size: 40px; }
  #audio-gate-btn .label {
    font-size: 14px;
    letter-spacing: 2px;
    color: #bf00ff;
    text-transform: uppercase;
  }
  #audio-gate-btn .sub {
    font-size: 11px;
    color: rgba(255,255,255,0.45);
  }

  #popup {
    position: absolute;
    bottom: 60px;
    right: 60px;
    width: 720px;
    display: flex;
    flex-direction: column;
    opacity: 0;
    transform: translateY(24px);
    transition: opacity 0.4s ease, transform 0.4s ease;
    pointer-events: none;
  }

  #popup.visible {
    opacity: 1;
    transform: translateY(0);
  }

  /* ── Header ── */
  #header {
    background: linear-gradient(90deg, #0d0d1a 0%, #1a0033 60%, #2d004d 100%);
    border: 1px solid #bf00ff;
    border-bottom: none;
    padding: 10px 18px 10px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    position: relative;
    overflow: hidden;
  }

  #header::before {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      90deg, transparent, transparent 8px,
      rgba(191,0,255,0.04) 8px, rgba(191,0,255,0.04) 9px
    );
    pointer-events: none;
  }

  .so-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 3px;
    color: #bf00ff;
    text-transform: uppercase;
    text-shadow: 0 0 8px #bf00ff;
    white-space: nowrap;
  }

  .so-divider {
    width: 1px;
    height: 22px;
    background: rgba(191,0,255,0.4);
    flex-shrink: 0;
  }

  #broadcaster-name {
    font-size: 20px;
    font-weight: 700;
    color: #fff;
    text-shadow: 0 0 12px rgba(191,0,255,0.8), 0 0 24px rgba(191,0,255,0.4);
    letter-spacing: 1px;
    flex: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ── Video ── */
  #clip-wrapper {
    position: relative;
    overflow: hidden;
    background: #000;
    border: 1px solid #bf00ff;
    border-bottom: none;
  }

  #clip-video {
    display: block;
    width: 720px;
    height: 405px;
    object-fit: cover;
  }

  @keyframes scan {
    0%   { transform: translateY(-2px); }
    100% { transform: translateY(405px); }
  }

  #scan-line {
    position: absolute;
    left: 0; top: 0;
    width: 100%; height: 2px;
    background: linear-gradient(90deg, transparent, rgba(191,0,255,0.6), transparent);
    animation: scan 3s linear infinite;
    pointer-events: none;
  }

  /* ── Footer ── */
  #footer {
    background: #0d0d1a;
    border: 1px solid #bf00ff;
    padding: 8px 16px 6px;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  #clip-title {
    font-size: 13px;
    color: rgba(255,255,255,0.75);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  #progress-bar {
    height: 2px;
    background: rgba(191,0,255,0.2);
    border-radius: 2px;
    overflow: hidden;
  }

  #progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #bf00ff, #7b00ff);
    box-shadow: 0 0 6px #bf00ff;
    width: 100%;
    transform-origin: left;
    transition: transform linear;
  }
</style>
</head>
<body>

<!-- Shown once on load; click unlocks audio for the entire session -->
<div id="audio-gate">
  <button id="audio-gate-btn" onclick="unlockAudio()">
    <span class="icon">🔊</span>
    <span class="label">Click to enable audio</span>
    <span class="sub">Do this once in OBS / Streamlabs interact mode</span>
  </button>
</div>

<div id="popup">
  <div id="header">
    <span class="so-label">Shoutout</span>
    <div class="so-divider"></div>
    <span id="broadcaster-name"></span>
  </div>
  <div id="clip-wrapper">
    <video id="clip-video" playsinline></video>
    <div id="scan-line"></div>
  </div>
  <div id="footer">
    <div id="clip-title"></div>
    <div id="progress-bar"><div id="progress-fill"></div></div>
  </div>
</div>

<script>
  // Play a silent sound via AudioContext to satisfy the browser's user-gesture
  // requirement. After this runs once, video.play() will produce audio for the
  // rest of the page session without any further interaction.
  function unlockAudio() {
    const ctx = new AudioContext();
    const buf = ctx.createBuffer(1, 1, 22050);
    const src = ctx.createBufferSource();
    src.buffer = buf;
    src.connect(ctx.destination);
    src.start(0);
    ctx.resume();
    document.getElementById('audio-gate').classList.add('hidden');
  }

  const popup    = document.getElementById('popup');
  const nameEl   = document.getElementById('broadcaster-name');
  const videoEl  = document.getElementById('clip-video');
  const titleEl  = document.getElementById('clip-title');
  const fillEl   = document.getElementById('progress-fill');

  let dismissTimer = null;

  function showClip(clip) {
    if (dismissTimer) { clearTimeout(dismissTimer); dismissTimer = null; }

    nameEl.textContent  = '@' + clip.broadcasterName;
    titleEl.textContent = clip.title;

    // Server pre-downloads all segments and serves as a single MPEG-TS blob,
    // so a plain <video src> works without HLS.js or MSE.
    videoEl.src = clip.videoUrl;
    videoEl.play().catch(() => {});

    // Progress bar countdown
    const durationMs = (clip.duration || 30) * 1000;
    fillEl.style.transition = 'none';
    fillEl.style.transform  = 'scaleX(1)';
    void fillEl.offsetWidth;
    fillEl.style.transition = `transform ${durationMs}ms linear`;
    fillEl.style.transform  = 'scaleX(0)';

    popup.classList.add('visible');

    videoEl.onended = hideClip;
    dismissTimer = setTimeout(hideClip, Math.min(durationMs + 3000, 90000));
  }

  function hideClip() {
    popup.classList.remove('visible');
    videoEl.onended = null;
    setTimeout(() => { videoEl.src = ''; }, 500);
    if (dismissTimer) { clearTimeout(dismissTimer); dismissTimer = null; }
  }

  // ── WebSocket ──────────────────────────────────────────────────────────────
  function connect() {
    const ws = new WebSocket(`ws://${window.location.host}`);
    ws.onmessage = (e) => {
      let msg;
      try { msg = JSON.parse(e.data); } catch (_) { return; }
      if (msg.type === 'clip') showClip(msg.clip);
    };
    ws.onclose = () => setTimeout(connect, 3000);
    ws.onerror = () => ws.close();
  }

  connect();
</script>
</body>
</html>
