<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Break Card</title>
<!-- "休息中 / On break" card for a Browser Source, in the song overlay's look. Show it with a mode (☕).
     Browser Source: width 960, height 260, then scale it to 50% (it renders at 2x, like the song overlay).
     ?min=10 counts down 10 minutes (then "馬上回來 / Back soon"); without it, the time on break counts up.
     The clock starts when the page loads: tick "Refresh browser when scene becomes active" or
     "Shutdown source when not visible" so it starts again on every break.
     lang="en" like the song overlay: under zh-TW, OBS's browser picks a different (serif) font for Chinese. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html {
    -webkit-font-smoothing: antialiased;
    background: transparent !important;
    zoom: 2;   /* rendered at 2x; the Browser Source is scaled to 50% for sharp text */
  }

  :root {
    --bg-panel: rgba(8, 8, 20, 0.92);
    --border: rgba(120, 60, 220, 0.3);
    --purple: #b06aff;
    --amber: #ffb84a;
    --title: #f0e6ff;
    --text-dim: #7a6a9a;
  }

  html, body {
    width: 480px;
    background: transparent !important;
    font-family: 'Share Tech Mono', monospace;
    overflow: hidden;
  }

  body { padding: 6px; }

  .panel {
    display: flex; align-items: center; gap: 18px;
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-left: 4px solid var(--amber);
    border-radius: 8px;
    padding: 14px 20px 14px 22px;
    position: relative;
    backdrop-filter: blur(8px);
    animation: enter .6s cubic-bezier(.2,.8,.2,1) both;
  }
  .panel::before, .panel::after { content: ''; position: absolute; width: 10px; height: 10px; }
  .panel::before { top: -1px; left: -4px; border-top: 2px solid var(--purple); border-left: 2px solid var(--purple); }
  .panel::after  { bottom: -1px; right: -1px; border-bottom: 2px solid var(--purple); border-right: 2px solid var(--purple); }
  @keyframes enter { from { opacity: 0; transform: translateY(8px); } }

  .words { flex: 1; min-width: 0; }
  .title {
    font-size: 58px; font-weight: 400; line-height: 1; letter-spacing: 10px;
    color: var(--title); text-shadow: 0 0 18px rgba(176, 106, 255, 0.55);
  }
  .title-en {
    display: flex; align-items: center; gap: 10px; margin-top: 8px;
    font-family: 'Orbitron', sans-serif; font-size: 20px; font-weight: 500; letter-spacing: 7px;
    color: var(--amber);
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--amber); animation: blink 2s ease-in-out infinite; }
  @keyframes blink { 0%,100% { opacity: 1 } 50% { opacity: .2 } }

  .side { text-align: right; }
  .clock { font-family: 'Orbitron', sans-serif; font-size: 26px; font-weight: 500; color: var(--amber); letter-spacing: 2px; }
  .back { margin-top: 6px; font-size: 13px; color: var(--text-dim); white-space: nowrap; }

  .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: rgba(120, 60, 220, 0.18); overflow: hidden; }
  .bar-fill { height: 100%; background: linear-gradient(90deg, var(--purple), var(--amber)); transform-origin: left; }
  .bar[hidden] { display: none; }
</style>
</head>
<body>
<div class="panel">
  <div class="words">
    <div class="title">休息中</div>
    <div class="title-en"><span class="dot"></span>ON BREAK</div>
  </div>
  <div class="side">
    <div class="clock" id="clock">00:00</div>
    <div class="back" id="back">馬上回來 · BRB</div>
  </div>
  <div class="bar" id="bar" hidden><div class="bar-fill" id="bar-fill"></div></div>
</div>
<script>
  // ?min=N: count down N minutes; otherwise count the time on break up
  const minutes = Number(new URLSearchParams(location.search).get('min')) || 0;
  const start = Date.now();
  const total = minutes * 60000;
  const backAt = new Date(start + total).toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', hour12: false });
  const mmss = ms => {
    const s = Math.max(0, Math.round(ms / 1000));
    return `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
  };
  if (total) document.getElementById('bar').hidden = false;
  function tick() {
    const gone = Date.now() - start;
    if (!total) {
      document.getElementById('clock').textContent = mmss(gone);
      return;
    }
    const left = total - gone;
    document.getElementById('clock').textContent = mmss(left);
    document.getElementById('bar-fill').style.transform = `scaleX(${Math.max(0, left / total)})`;
    document.getElementById('back').textContent = left > 0 ? `${backAt} 回來 · Back` : '馬上回來 · Back soon';
  }
  tick();
  setInterval(tick, 1000);
</script>
</body>
</html>
